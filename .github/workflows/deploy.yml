name: Build + deploy to Cloudflare Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set site URL for branch
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "VITE_SITE_URL=https://dev.legally-design.pages.dev" >> "$GITHUB_ENV"
              ;;
            main)
              echo "VITE_SITE_URL=https://legally-design.pages.dev" >> "$GITHUB_ENV"
              ;;
            *)
              echo "VITE_SITE_URL=https://${{ github.ref_name }}.legally-design.pages.dev" >> "$GITHUB_ENV"
              ;;
          esac
          if [ -n "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" ]; then
            echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages project create legally-design --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy ./dist --project-name=legally-design --branch=${{ github.ref_name }} --commit-dirty=true
